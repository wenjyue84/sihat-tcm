# nginx site config for tcm.wenjyue.com → sihat-tcm-go (:3200)
# Install: sudo cp to /etc/nginx/sites-available/tcm.wenjyue.com
#          sudo ln -s ../sites-available/tcm.wenjyue.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d tcm.wenjyue.com  (after DNS resolves)

# --- who is the client? --------------------------------------------------------------------------------------
# The app (internal/server/auth.go clientIP) trusts CF-Connecting-IP first whenever its TCP peer is this nginx on
# loopback, and rate-limits per client address. nginx used to forward the CLIENT's own CF-Connecting-IP header
# untouched, so anyone who reached the origin without going through Cloudflare could pick a new rate-limit
# identity per request. Now the header is OVERWRITTEN: the real Cloudflare-supplied value only for connections that
# really come from a Cloudflare edge address, the TCP peer address for everybody else.
# (geo/map are http-level directives; this file is included inside http {}. Refresh the ranges from
#  https://www.cloudflare.com/ips/ now and then.)
geo $tcm_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $tcm_from_cloudflare $tcm_client_ip {
    1       $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name tcm.wenjyue.com;

    client_max_body_size 25m;  # image/audio uploads for WANG/WEN examinations

    # HSTS: the login cookie is Secure, but a first visit over http:// (or an sslstrip-style downgrade) is only
    # prevented once the browser has been told to stay on https. Browsers ignore the header on plain http, so it
    # takes effect on the 443 server certbot derives from this block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Apple Health export.zip upload (internal/server/health_apple.go caps it at 95 MB; Cloudflare free plan caps requests at 100 MB)
    location = /api/health/apple/import {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $tcm_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $tcm_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # long-running Gemini analysis calls
    }
}
