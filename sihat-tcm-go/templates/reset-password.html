<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Sihat TCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{asset "/static/css/app.css"}}">
  <link rel="stylesheet" href="{{asset "/static/css/art.css"}}">
  {{template "favicon"}}
</head>
<body class="page-auth">

{{template "header" .}}

<main class="auth-container">
  <figure class="auth-art">
    <img src="{{asset "/static/img/art/reset.webp"}}" width="900" height="700" alt="Illustration of a brass key with a jade tassel resting on a leaf beside a teacup." data-i18n-alt="art.reset" loading="lazy" decoding="async">
    <figcaption data-i18n="art.reset.t">A fresh key for your account</figcaption>
  </figure>
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/">Sihat TCM <span class="logo-zh">中医</span></a>
    </div>
    <h1 class="auth-title" data-i18n="reset.title">Reset Password 重置密码</h1>
    <p class="auth-sub" data-i18n="reset.sub">Choose a new password for your account.</p>

    <div id="reset-alert" role="alert" class="alert hidden"></div>

    <div id="reset-form">
      <div class="form-group">
        <label class="form-label" for="reset-password" data-i18n="reset.newpw">New Password 新密码</label>
        <input class="form-input" id="reset-password" type="password" placeholder="Min 8 characters" autocomplete="new-password">
        <span class="form-hint" data-i18n="login.pwhint">Minimum 8 characters</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="reset-password2" data-i18n="reset.confirm">Confirm Password 确认密码</label>
        <input class="form-input" id="reset-password2" type="password" placeholder="Re-enter password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-full mt-2" id="reset-btn" onclick="resetSubmit()" data-i18n="reset.btn">
        Update Password 更新密码
      </button>
    </div>

    <hr class="divider">
    <p class="text-center text-sm text-muted">
      <a href="/login" data-i18n="login.backtologin">← Back to login 返回登录</a>
    </p>
  </div>
</main>

{{template "footer" .}}

<script src="{{asset "/static/js/reset.js"}}"></script>
</body>
</html>
