<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Sihat TCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{asset "/static/css/app.css"}}">
</head>
<body class="page-auth">

{{template "header" .}}

<main class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/">Sihat TCM <span class="logo-zh">中医</span></a>
    </div>
    <h1 class="auth-title">Reset Password 重置密码</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <div id="reset-alert" class="alert hidden"></div>

    <div id="reset-form">
      <div class="form-group">
        <label class="form-label" for="reset-password">New Password 新密码</label>
        <input class="form-input" id="reset-password" type="password" placeholder="Min 8 characters" autocomplete="new-password">
        <span class="form-hint">Minimum 8 characters</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="reset-password2">Confirm Password 确认密码</label>
        <input class="form-input" id="reset-password2" type="password" placeholder="Re-enter password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-full mt-2" id="reset-btn" onclick="resetSubmit()">
        Update Password 更新密码
      </button>
    </div>

    <hr class="divider">
    <p class="text-center text-sm text-muted">
      <a href="/login">← Back to login 返回登录</a>
    </p>
  </div>
</main>

{{template "footer" .}}

<script src="{{asset "/static/js/reset.js"}}"></script>
</body>
</html>
